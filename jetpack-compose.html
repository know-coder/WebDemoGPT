const all=[...base,...extra];const search=document.getElementById('search'),grid=document.getElementById('grid'),cats=document.getElementById('categories'),empty=document.getElementById('empty');const categories=['All',...new Set(all.map(x=>x[1]))];let active='All';categories.forEach(c=>{const b=document.createElement('button');b.className='cat'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{active=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};cats.appendChild(b)});

orm:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}';if(/Bounce/.test(name))return'0%{transform:scale(.7);opacity:0}45%{transform:scale(1.12);opacity:1}65%{transform:scale(.94)}80%{transform:scale(1.04)}100%{transform:scale(1)}';if(/Horizontal Page Slide|Push Left|Push Right|Slide Left|Content Slide/.test(name))return'0%{transform:translateX(-85px);opacity:0}45%{transform:none;opacity:1}100%{transform:translateX(85px);opacity:0}';if(/Vertical Page Slide|Push Up|Push Down|Page Enter|Page Exit|Slide In|Slide Out/.test(name))return'0%{transform:translateY(75px);opacity:0}45%{transform:none;opacity:1}100%{transform:translateY(-65px);opacity:0}';if(/Cover From Left|Reveal From Left/.test(name))return'0%{clip-path:inset(0 100% 0 0);transform:translateX(-25px)}55%{clip-path:inset(0);transform:none}100%{clip-path:inset(0 0 0 100%);transform:translateX(25px)}';if(/Cover From Right|Reveal From Right/.test(name))return'0%{clip-path:inset(0 0 0 100%);transform:translateX(25px)}55%{clip-path:inset(0);transform:none}100%{clip-path:inset(0 100% 0 0);transform:translateX(-25px)}';if(/Zoom Page|Zoom Out Page|Scale Page/.test(name))return'0%{transform:scale(.45);opacity:0}55%{transform:scale(1);opacity:1}100%{transform:scale(1.18);opacity:0}';if(/Rotate Page/.test(name))return'0%{transform:rotateY(-90deg);opacity:0}55%{transform:rotateY(0);opacity:1}100%{transform:rotateY(90deg);opacity:0}';if(/Crossfade|Fade Page|Fade Through/.test(name))return'0%,35%{opacity:1}50%{opacity:.05}65%,100%{opacity:1}';if(/Shared Screen|Shared Axis X|Shared Axis Y|Shared Element|Shared Bounds/.test(name))return'0%{transform:scale(.55) translateX(-45px);opacity:.1}50%{transform:scale(1);opacity:1}100%{transform:scale(1.15) translateX(45px);opacity:.1}';if(/Loading|Refresh|Progress|Skeleton|Data Arrival|Content Placeholder/.test(name))return'0%,100%{transform:translateX(-38px);opacity:.45}50%{transform:translateX(38px);opacity:1}';if(/Spin/.tes function render(){const q=search.value.toLowerCase();grid.innerHTML='';let shown=0;all.forEach((a,i)=>{if((!q||a[0].toLowerCase().includes(q))&&(active==='All'||a[1]===active)){shown++;const type=visual(a[0],i),symbol=type==='icon'?'✦':type==='line'?'━━':type==='ring'?'◉':type==='page'?'▰':'●';const cls='j'+i,s=document.createElement('style');s.textContent=`.${cls}{animation:k${i} ${(1.05+i%7*.13).toFixed(2)}s ease-in-out infinite;animation-delay:${-(i*.083%2.8).toFixed(2)}s;animation-fill-mode:both}@keyframes k${i}{${keyframes(a[0],i)}}`;document.head.appendChild(s);const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="preview"><div class="stage"><div class="${type} shape ${cls}">${symbol}</div></div></div><div class="card-info"><h2>${i+1}. ${a[0]}</h2><small>${a[1]}</small><div class="code">${a[0]} • Jetpack Compose</div></div>`;grid.appendChild(c)}});empty.style.display=shown?'none':'block'}search.oninput=render;render();</script></body></html>
