*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08090d;color:#f5f5f7}header{height:72px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20232c;background:#0b0c11;position:sticky;top:0;z-index:10}a{color:#fff;text-decoration:none}.brand{font-weight:800}.back{color:#a5a9b5;font-size:13px}main{max-width:1150px;margin:auto;padding:55px 24px 80px}.hero{text-align:center;margin-bottom:42px}.badge{display:inline-block;padding:7px 12px;border:1px solid #30333d;border-radius:99px;color:#aaaeba;font-size:12px}.hero h1{font-size:clamp(38px,6vw,64px);margin:18px 0 12px;letter-spacing:-3px}.hero h1 span{color:#8b5cf6}.hero p{color:#858a99;max-width:650px;margin:auto;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}.toolbar input,.toolbar select{background:#11131a;color:#ddd;border:1px solid #292d38;border-radius:10px;padding:11px 13px;outline:0}.toolbar input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#101219;border:1px solid #222631;border-radius:16px;overflow:hidden}.preview{height:210px;display:grid;place-items:center;background:radial-gradient(circle,#191c27,#0b0c11 70%);overflow:hidden}.stage{width:170px;height:125px;display:grid;place-items:center;position:relative}.box{width:76px;height:58px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);box-shadow:0 12px 30px #0008}.circle{width:62px;height:62px;border-radius:50%;background:#8b5cf6;box-shadow:0 0 25px #8b5cf655}.line{width:120px;height:9px;border-radius:99px;background:#8b5cf6}.fab{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#8b5cf6;font-size:28px}.dialog{width:125px;height:75px;border-radius:12px;background:#20232e;border:1px solid #555b6b}.anim{will-change:transform,opacity,filter,clip-path,box-shadow;background-origin:border-box}.card-info{padding:14px}.card-info h2{font-si <header><a class="brand" href="index.html">WebDemoGPT</a><a class="back" href="index.html">← Animation Gallery</a></header>
<main><section class="hero"><span class="badge">Android • Jetpack Compose</span><h1>Jetpack Compose <span>Animations.</span></h1><p>50 animasi Jetpack Compose dengan preview yang benar-benar memperagakan karakter gerak masing-masing animasi.</p></section>

const animations=[
['Fade In','Visibility','box','alpha = animateFloatAsState(1f)'],['Fade Out','Visibility','box','AnimatedVisibility(visible = false)'],['Slide In','Visibility','box','slideInVertically()'],['Slide Out','Visibility','box','slideOutVertically()'],['Expand Vertically','Visibility','box','expandVertically()'],['Shrink Vertically','Visibility','box','shrinkVertically()'],['Expand Horizontally','Visibility','line','expandHorizontally()'],['Shrink Horizontally','Visibility','line','shrinkHorizontally()'],['Scale In','Visibility','circle','scaleIn()'],['Scale Out','Visibility','circle','scaleOut()'],

['Screen Slide','Navigation','box','slideInHorizontally() + slideOutHorizontally()'],['Shared Axis','Navigation','box','slide + fade transition'],['Enter Transition','Navigation','box','enterTransition = fadeIn()'],['Exit Transition','Navigation','box','exitTransition = fadeOut()'],['Pop Enter','Navigation','box','popEnterTransition'],['Pop Exit','Navigation','box','popExitTransition'],['Bottom Sheet','Navigation','dialog','ModalBottomSheet(...)'],['Dialog Enter','Navigation','dialog','AnimatedVisibility + scaleIn()'],['Dialog Exit','Navigation','dialog','scaleOut()'],['Drawer Slide','Navigation','box','ModalNavigationDrawer(...)'],

const grid=document.getElementById('grid');
function render(){const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;grid.innerHTML='';animations.forEach((a,i)=>{if((!q||a[0].toLowerCase().includes(q))&&(f==='all'||a[1]===f)){const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="preview"><div class="stage"><div class="${a[2]} anim a${i}">${a[2]==='fab'?'+':''}</div></div></div><div class="card-info"><h2>${i+1}. ${a[0]}</h2><small>${a[1]}</small><div class="code">${a[3]}</div></div>`;grid.appendChild(c)}})}
const style=document.createElement('style');style.textContent=keyframes.map((k,i)=>`.a${i}{animation:k${i} ${1.05+(i%8)*.12}s cubic-bezier(.2,.75,.25,1) infinite;animation-delay:${-(i*.13).toFixed(2)}s;animation-fill-mode:both}@keyframes k${i}{${k}}`).join('');document.head.appendChild(style);render();document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;
</script></body></html>
