name: Fix Jetpack animations
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Jetpack animation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jetpack-compose.html')
          s = p.read_text()
          marker = 'WEBDEMOGPT_JETPACK_FIX_V2'
          if marker in s:
              raise SystemExit(0)
          fix = r'''<script>/* WEBDEMOGPT_JETPACK_FIX_V2 */
(function(){
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const css=document.createElement('style');css.textContent='.card{transition:transform .22s ease,box-shadow .22s ease}.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px #0008}.preview{cursor:pointer}.preview .scene,.preview .ui-popup,.preview .ui-dialog,.preview .ui-page,.preview .ui-sheet,.preview .ui-menu,.preview .ui-toast,.preview .ui-drawer{animation:none!important}.preview.reduced *{animation:none!important;transition:none!important}';document.head.appendChild(css);
function run(preview,name,i){if(!preview||preview.dataset.busy)return;preview.dataset.busy='1';if(reduced.matches){preview.classList.add('reduced');delete preview.dataset.busy;return}const n=name.toLowerCase(),t=preview.querySelector('.ui-popup,.ui-dialog,.ui-page,.ui-sheet,.ui-menu,.ui-toast,.ui-drawer,.ui-ripple,.ui-btn')||preview.querySelector('.scene'),d=620+(i%5)*55,e='cubic-bezier(.2,.8,.2,1)';let k;if(/ripple/.test(n))k=[{transform:'scale(.3)',opacity:.8},{transform:'scale(4)',opacity:0}];else if(/shake|error/.test(n))k=[{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(9px)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}];else if(/rotate/.test(n))k=[{transform:'rotate(0) scale(.85)'},{transform:'rotate(180deg) scale(1.08)'},{transform:'rotate(360deg) scale(1)'}];else if(/fade|crossfade/.test(n))k=[{opacity:0},{opacity:1}];else if(/zoom|scale/.test(n))k=[{transform:'scale(.65)',opacity:0},{transform:'scale(1.06)',opacity:1},{transform:'scale(1)',opacity:1}];else if(/slide|push|reveal|cover|page|navigation|route|screen/.test(n))k=[{transform:'translateX(70px)',opacity:0},{transform:'translateX(0)',opacity:1}];else if(/drawer/.test(n))k=[{transform:'translateX(-115px)',opacity:0},{transform:'translateX(7px)',opacity:1},{transform:'translateX(0)',opacity:1}];else if(/sheet/.test(n))k=[{transform:'translateY(90px)',opacity:0},{transform:'translateY(-5px)',opacity:1},{transform:'translateY(0)',opacity:1}];else if(/popup|dropdown|menu|tooltip/.test(n))k=[{transform:'translateY(28px) scale(.82)',opacity:0},{transform:'translateY(-3px) scale(1.03)',opacity:1},{transform:'translateY(0) scale(1)',opacity:1}];else if(/bounce/.test(n))k=[{transform:'translateY(0) scale(1)'},{transform:'translateY(8px) scale(.92)'},{transform:'translateY(-7px) scale(1.05)'},{transform:'translateY(0) scale(1)'}];else if(/press|tap|button|fab|card|select|toggle|check/.test(n))k=[{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1.06)'},{transform:'scale(1)'}];else if(/expand/.test(n))k=[{transform:'scale(.65)',opacity:0},{transform:'scale(1.05)',opacity:1},{transform:'scale(1)',opacity:1}];else if(/collapse|close|dismiss|exit/.test(n))k=[{transform:'scale(1)',opacity:1},{transform:'scale(.65)',opacity:0}];else if(/loading|progress|refresh|shimmer|pulse|infinite|repeat/.test(n))k=[{transform:'scaleX(.45)',opacity:.55},{transform:'scaleX(1)',opacity:1},{transform:'scaleX(.45)',opacity:.55}];else k=[{transform:'translateY(12px) scale(.9)',opacity:.25},{transform:'translateY(-5px) scale(1.05)',opacity:1},{transform:'translateY(0) scale(1)',opacity:1}];t.animate(k,{duration:d,easing:e,fill:'both'}).finished.catch(()=>{}).then(()=>{delete preview.dataset.busy})}
function fixedScene(name){const t=sceneType(name),common=l=>'<div class="scene"><button class="ui-btn" type="button">'+l+'</button><span class="flow-arrow">→</span></div>';if(t==='popup')return common('Open Popup')+'<div class="ui-popup"><b>Popup</b><span>Open</span><span>Settings</span></div>';if(t==='dialog')return common('Open Dialog')+'<div class="ui-dialog"><b>Confirm action?</b><p>Dialog appears</p><button class="ui-btn" type="button">Confirm</button></div>';if(t==='page')return '<div class="scene"><div class="ui-card"><div class="ui-title"></div><div class="ui-row"></div><button class="ui-btn" type="button">Open Page</button></div><span class="flow-arrow">→</span><div class="ui-page"><div class="bar"></div><div class="ui-row"></div><div class="ui-row"></div></div></div>';if(t==='sheet')return common('Open Sheet')+'<div class="ui-sheet"><b style="font-size:9px">Bottom Sheet</b><div class="ui-row"></div><button class="ui-btn" type="button">Action</button></div>';if(t==='drawer')return common('☰ Open')+'<div class="ui-drawer"><b style="font-size:9px">Navigation</b><i></i><i></i><i></i></div>';if(t==='menu')return common('Open Menu')+'<div class="ui-menu"><i></i><i></i><i></i></div>';if(t==='toast')return common('Tap Action')+'<div class="ui-toast">✓ Action completed</div>';return '<div class="scene"><button class="ui-btn" type="button">Press</button><div class="ui-ripple"></div></div>'}
window.render=function(){const q=search.value.trim().toLowerCase();grid.innerHTML='';const f=document.createDocumentFragment();let shown=0;all.forEach((x,i)=>{if(active!=='All'&&x[1]!==active)return;if(q&&!x[0].toLowerCase().includes(q)&&!x[1].toLowerCase().includes(q))return;shown++;const c=document.createElement('article');c.className='card';c.innerHTML='<div class="preview"><div class="stage">'+fixedScene(x[0])+'</div></div><div class="card-info"><h2>'+x[0]+'</h2><small>'+x[1]+'</small><div class="code">'+composeCode(x[0])+'</div></div>';const p=c.querySelector('.preview');p.addEventListener('click',()=>run(p,x[0],i));c.querySelectorAll('.ui-btn').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();run(p,x[0],i)}));f.appendChild(c)});grid.appendChild(f);empty.style.display=shown?'none':'block'};search.oninput=render;render();})();</script>'''
          s=s.replace('</script></body></html>', fix + '</body></html>', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jetpack-compose.html
          git commit -m 'Fix Jetpack Compose animation previews' || exit 0
          git push
